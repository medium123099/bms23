<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админ-панель — TreeLife Stimulation</title>
<style>
:root{--teal:#1f7a7a;--teal-d:#165c5c;--bg:#f3f7f7;--card:#fff;--line:#dbe5e5;--txt:#1d2b2b;--mut:#6b7d7d;--red:#c0392b;--amber:#b7791f;--green:#2f855a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--teal-d);color:#fff}
.top__row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:600;flex:1}
.top a,.top button{color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
.top a:hover,.top button:hover{background:rgba(255,255,255,.22)}
.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;color:#cfe6e6;border:0;padding:12px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;margin-left:6px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat small{color:var(--mut)}
.stat b{display:block;font-size:24px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h2{margin:0 0 12px;font-size:17px}
.two{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.chart i{display:block;width:100%;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #c9d6d6;border-radius:8px;background:#fff;color:var(--txt);max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.ghost:hover{background:#eef6f6}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.red:hover{background:#fdf1ef}
.btn.sm{padding:5px 10px;font-size:13px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:500;background:#fafcfc}
tr:last-child td{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--mut)}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px}
.pill.new{background:#e7f0ff;color:#2b5cb8}.pill.invoice{background:#efe9ff;color:#5b3fb0}.pill.payment{background:#fff3d9;color:var(--amber)}.pill.receipt{background:#e3f5ea;color:var(--green)}.pill.shipping{background:#e0f4f4;color:var(--teal-d)}
.pill.shipped{background:#fff3d9;color:var(--amber)}.pill.done{background:#e3f5ea;color:var(--green)}.pill.cancelled{background:#fdecea;color:var(--red)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.form label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.form input,.form select{width:100%}
.form .wide{grid-column:1/-1}
.rv{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card);margin-bottom:12px}
.rv__head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rv__stars{color:#e0a800;letter-spacing:2px}
.rv p{margin:8px 0;white-space:pre-line}
.rv__act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sub button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.sub button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.rate button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:#c9d6d6;padding:0 2px}
.rate button.on{color:#e0a800}
.note{background:#fff8e6;border:1px solid #f0dca0;border-radius:10px;padding:12px 14px;color:#6b5510;font-size:14px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--teal-d);color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.denied{max-width:420px;margin:15vh auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px}
.denied a{color:var(--teal)}
.err{color:var(--red);font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  /* ---------- доступ ----------
     Роль проверяет сервер (check_auth.php), а не localStorage — так
     «занять» админку регистрацией нужного номера не получится. */
  /* ---------- данные: хранятся на сервере (admin_api.php), в браузере — только кэш ---------- */
  var CACHE = { tl_orders: [], tl_reviews: [], tl_users: [], tl_calls: [] };
  var KIND = { tl_orders: 'order', tl_reviews: 'review', tl_calls: 'call' };
  var notify = function () {};      // подставляется в init()
  var onSynced = function () {};

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function api(body) {
    var h = { 'X-Requested-With': 'fetch' };
    if (body) h['Content-Type'] = 'application/json';
    return fetch('admin_api.php', { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: h, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json(); });
  }

  function fetchAll() {
    return api().then(function (d) {
      if (!d || !d.success) throw new Error('load');
      CACHE.tl_orders = d.orders || [];
      CACHE.tl_reviews = d.reviews || [];
      CACHE.tl_users = d.users || [];
      CACHE.tl_calls = d.calls || [];
    });
  }

  function load(k, f) { return CACHE[k] ? clone(CACHE[k]) : f; }

  /* save() сравнивает новый список со старым и отправляет на сервер только разницу */
  function save(k, v) {
    var kind = KIND[k];
    if (!kind) return true;                       // клиенты (users) только для чтения
    var old = CACHE[k] || [], oldMap = {}, seen = {}, ops = [];
    old.forEach(function (o) { oldMap[o.id] = JSON.stringify(o); });
    v.forEach(function (it) {
      seen[it.id] = 1;
      if (!(it.id in oldMap)) ops.push({ op: 'add', kind: kind, item: it });
      else if (oldMap[it.id] !== JSON.stringify(it)) ops.push({ op: 'upd', kind: kind, item: it });
    });
    old.forEach(function (o) { if (!seen[o.id]) ops.push({ op: 'del', kind: kind, id: o.id }); });
    CACHE[k] = clone(v);
    if (ops.length) {
      api({ ops: ops })
        .then(function (r) { if (!r || !r.success) throw new Error('save'); })
        .catch(function () { notify('Не удалось сохранить на сервере'); })
        .then(function () { return fetchAll(); })
        .then(function () { onSynced(); })
        .catch(function () {});
    }
    return true;
  }

  root.innerHTML = '<div class="denied"><h2>Проверка доступа…</h2></div>';

  fetch('check_auth.php', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.success || !data.auth || data.user.role !== 'admin') {
        root.innerHTML = '<div class="denied"><h2>Доступ закрыт</h2><p>Войдите как администратор через личный кабинет на сайте.</p><a href="/">На главную</a></div>';
        return;
      }
      return fetchAll().then(init);
    })
    .catch(function () {
      root.innerHTML = '<div class="denied"><h2>Доступ закрыт</h2><p>Не удалось загрузить данные. Попробуйте обновить страницу.</p><a href="/">На главную</a></div>';
    });

  function init() {
    notify = toast; onSynced = shell;

    /* изменения, сделанные в боте MAX, подтягиваются сами раз в 20 секунд */
    setInterval(function () {
      if (document.hidden || X.views[st.view]) return;
      var a = document.activeElement, t = a && a.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;   // не мешаем вводу
      fetchAll().then(function () { onSynced(); }).catch(function () {});
    }, 20000);

  /* ---------- утилиты ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function fdate(iso) { var d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('ru-RU'); }
  function dkey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function stars(n) { var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '☆'; return s; }
  var tt;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* телефон: +7 и только цифры */
  function nat(raw) {
    raw = String(raw || '');
    var d = raw.replace(/\D/g, '');
    if (/^\s*\+7/.test(raw) || (d.length > 10 && (d[0] === '7' || d[0] === '8'))) d = d.slice(1);
    return d.slice(0, 10);
  }
  function fmtPhone(d) {
    var s = '+7 ';
    if (d.length) s = '+7 ' + d.slice(0, 3);
    if (d.length > 3) s += ' ' + d.slice(3, 6);
    if (d.length > 6) s += '-' + d.slice(6, 8);
    if (d.length > 8) s += '-' + d.slice(8, 10);
    return s;
  }
  function showPhone(p) { return p && /^\+7\d{10}$/.test(p) ? fmtPhone(p.slice(2)) : (p || '—'); }

  /* ---------- данные ---------- */
  var STATUS = { 'new': 'Заявка', invoice: 'Счёт', payment: 'Оплата', receipt: 'Чек', shipping: 'Отправка', shipped: 'Отправлен', done: 'Выполнен', cancelled: 'Отменён' };
  var REVENUE = { receipt: 1, shipping: 1, shipped: 1, done: 1 };   // деньги уже получены
  var PRODUCTS = [
    { name: 'TreeLife Lite', price: 50000 },
    { name: 'TreeLife Stimulation', price: 65000 },
    { name: 'TreeLife Vacuum', price: 100000 },
    { name: 'Обучение', price: 0 },
    { name: 'Другое', price: 0 }
  ];
  function orders() { return load('tl_orders', []); }
  function reviews() { return load('tl_reviews', []); }
  function users() { return load('tl_users', []); }
  function calls() { return load('tl_calls', []); }
  function orderTotal(o) {
    if (typeof o.total === 'number') return o.total;
    return (o.items || []).reduce(function (s, i) { return s + (Number(i.price) || 0) * (Number(i.qty) || 1); }, 0);
  }
  function itemsText(o) {
    return (o.items || []).map(function (i) { return i.name + (i.qty > 1 ? ' × ' + i.qty : ''); }).join(', ') || '—';
  }

  /* ---------- состояние ---------- */
  var st = { view: 'dash', oq: '', of: 'all', showForm: false, rtab: 'pending', editing: null, showRevForm: false, rrating: 0 };

  /* ---------- каркас ---------- */
  function shell() {
    var pend = reviews().filter(function (r) { return r.status === 'pending'; }).length;
    var fresh = orders().filter(function (o) { return o.status === 'new'; }).length;
    function tab(v, label, badge) {
      return '<button data-a="nav" data-v="' + v + '" class="' + (st.view === v ? 'on' : '') + '">' + label + (badge ? '<span class="badge">' + badge + '</span>' : '') + '</button>';
    }
    root.innerHTML =
      '<div class="top"><div class="top__row"><h1>TreeLife Stimulation — админ-панель</h1>' +
      '<a href="pipeline.html">Заказы по этапам</a><a href="/">На сайт</a><button data-a="logout">Выйти</button></div>' +
      '<div class="tabs">' + tab('dash', 'Обзор') + tab('orders', 'Продажи', fresh) + tab('reviews', 'Отзывы', pend) + tab('clients', 'Клиенты') + tab('calls', 'Заявки', calls().length) + tab('catalog', 'Каталог') + tab('reports', 'Отчёты') + tab('mailing', 'Рассылка') + tab('service', 'Сервис') + '</div></div>' +
      '<main id="view"></main>';
    paint();
  }

  function paint() {
    var v = document.getElementById('view');
    if (X.views[st.view]) { extraPaint(v); return; }
    v.innerHTML = st.view === 'dash' ? dashView() : st.view === 'orders' ? ordersView() : st.view === 'reviews' ? reviewsView() : st.view === 'calls' ? callsView() : clientsView();
    if (st.view === 'orders') bindOrderForm();
    if (st.view === 'reviews') paintRate();
  }

  /* ---------- ОБЗОР ---------- */
  function dashView() {
    var os = orders(), rs = reviews();
    var rev = 0, rev30 = 0, since = Date.now() - 30 * 864e5;
    os.forEach(function (o) {
      if (REVENUE[o.status]) { var t = orderTotal(o); rev += t; if (new Date(o.date).getTime() >= since) rev30 += t; }
    });
    var days = [], map = {}, i, d;
    for (i = 13; i >= 0; i--) { d = new Date(); d.setDate(d.getDate() - i); var k = dkey(d); days.push({ k: k, label: d.getDate(), v: 0 }); map[k] = days[days.length - 1]; }
    os.forEach(function (o) { if (REVENUE[o.status]) { var kk = dkey(new Date(o.date)); if (map[kk]) map[kk].v += orderTotal(o); } });
    var max = Math.max.apply(null, days.map(function (x) { return x.v; }).concat([1]));
    var chart = days.map(function (x) {
      return '<div title="' + x.k + ': ' + money(x.v) + '"><i style="height:' + Math.round(x.v / max * 100) + '%"></i>' + x.label + '</div>';
    }).join('');
    var pend = rs.filter(function (r) { return r.status === 'pending'; });
    var recent = os.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }).slice(0, 5);

    return '<div class="grid">' +
      '<div class="stat"><small>Выручка (оплачено и далее)</small><b>' + money(rev) + '</b></div>' +
      '<div class="stat"><small>За 30 дней</small><b>' + money(rev30) + '</b></div>' +
      '<div class="stat"><small>Всего заказов</small><b>' + os.length + '</b></div>' +
      '<div class="stat"><small>Новых заказов</small><b>' + os.filter(function (o) { return o.status === 'new'; }).length + '</b></div>' +
      '<div class="stat"><small>Отзывов на модерации</small><b>' + pend.length + '</b></div>' +
      '<div class="stat"><small>Зарегистрировано</small><b>' + users().length + '</b></div></div>' +
      '<div class="card"><h2>Выручка за 14 дней</h2><div class="chart">' + chart + '</div></div>' +
      '<div class="two"><div class="card"><h2>Последние заказы</h2>' +
        (recent.length ? recent.map(function (o) {
          return '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><span>' + esc(o.customer || '—') + ' · ' + esc(itemsText(o)) + '</span><b>' + money(orderTotal(o)) + '</b></div>';
        }).join('') : '<div class="empty">Заказов пока нет</div>') +
      '</div><div class="card"><h2>Ждут модерации</h2>' +
        (pend.length ? pend.slice(0, 5).map(function (r) {
          return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="rv__stars">' + stars(r.rating) + '</span> ' + esc(r.name) + '<div style="color:var(--mut)">' + esc(String(r.text).slice(0, 90)) + '</div></div>';
        }).join('') : '<div class="empty">Всё проверено</div>') +
      '</div></div>' +
      '<div class="card"><h2>Резервная копия</h2>' +
        '<p style="color:var(--mut);margin-top:0">Данные хранятся на сервере, в базе данных. Копию можно скачать для архива.</p>' +
        '<button class="btn" data-a="backup">Скачать копию (JSON)</button> ' +
        '<label class="btn ghost" style="display:inline-block">Загрузить копию<input type="file" id="restoreFile" accept="application/json" hidden></label></div>';
  }

  /* ---------- ПРОДАЖИ ---------- */
  function ordersView() {
    return '<div class="toolbar">' +
      '<input id="oq" placeholder="Поиск: имя, телефон, товар" value="' + esc(st.oq) + '" style="min-width:240px">' +
      '<select id="of"><option value="all">Все статусы</option>' +
      Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (st.of === k ? ' selected' : '') + '>' + STATUS[k] + '</option>'; }).join('') + '</select>' +
      '<button class="btn" data-a="toggleForm">' + (st.showForm ? 'Скрыть форму' : '+ Добавить продажу') + '</button>' +
      '<button class="btn ghost" data-a="csv">Экспорт CSV</button></div>' +
      (st.showForm ? orderForm() : '') +
      '<div class="tablewrap" id="otable">' + ordersTable() + '</div>';
  }

  function orderForm() {
    return '<div class="card"><h2>Новая продажа</h2><div class="form">' +
      '<div><label>Дата</label><input type="date" id="nf_date" value="' + dkey(new Date()) + '"></div>' +
      '<div><label>Клиент</label><input id="nf_name" placeholder="Имя"></div>' +
      '<div><label>Телефон</label><input id="nf_phone" placeholder="+7 "><div class="err" id="nf_perr"></div></div>' +
      '<div><label>Товар</label><select id="nf_prod">' + PRODUCTS.map(function (p, i) { return '<option value="' + i + '">' + p.name + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Название (если «Другое»)</label><input id="nf_custom" placeholder="Название"></div>' +
      '<div><label>Кол-во</label><input type="number" id="nf_qty" min="1" value="1"></div>' +
      '<div><label>Цена за шт., ₽</label><input type="number" id="nf_price" min="0" value="' + PRODUCTS[0].price + '"></div>' +
      '<div><label>Статус</label><select id="nf_status">' + Object.keys(STATUS).map(function (k) { return '<option value="' + k + '">' + STATUS[k] + '</option>'; }).join('') + '</select></div>' +
      '<div class="wide"><label>Комментарий</label><input id="nf_comment" placeholder="Необязательно"></div></div>' +
      '<div class="err" id="nf_err"></div><button class="btn" data-a="saveOrder">Сохранить</button></div>';
  }

  function bindOrderForm() {
    var prod = document.getElementById('nf_prod'), price = document.getElementById('nf_price'), phone = document.getElementById('nf_phone');
    if (prod) prod.addEventListener('change', function () { price.value = PRODUCTS[Number(prod.value)].price; });
    if (phone) {
      phone.setAttribute('inputmode', 'numeric');
      var end = function () { var n = phone.value.length; try { phone.setSelectionRange(n, n); } catch (e) {} };
      phone.addEventListener('keydown', function (e) { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.key && e.key.length === 1 && !/\d/.test(e.key)) e.preventDefault(); });
      phone.addEventListener('input', function () { phone.value = fmtPhone(nat(phone.value)); end(); });
      phone.addEventListener('focus', function () { if (!phone.value) phone.value = '+7 '; setTimeout(end, 0); });
      phone.addEventListener('blur', function () { if (!nat(phone.value)) phone.value = ''; });
    }
  }

  function filteredOrders() {
    var q = st.oq.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    return orders().filter(function (o) {
      if (st.of !== 'all' && o.status !== st.of) return false;
      if (!q) return true;
      var hay = ((o.customer || '') + ' ' + (o.email || '') + ' ' + (o.agent || '') + ' ' + itemsText(o) + ' ' + (o.comment || '')).toLowerCase();
      return hay.indexOf(q) !== -1 || (qd && String(o.phone || '').replace(/\D/g, '').indexOf(qd) !== -1);
    }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  }

  function ordersTable() {
    var list = filteredOrders();
    if (!list.length) return '<div class="empty">Ничего не найдено</div>';
    return '<table><thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Состав</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>' +
      list.map(function (o) {
        return '<tr><td>' + esc(o.num || String(o.id).slice(-4)) + '</td><td>' + fdate(o.date) + '</td>' +
          '<td>' + esc(o.customer || '—') + '<div style="color:var(--mut);font-size:13px">' + esc(showPhone(o.phone)) + '</div>' + [o.email, o.cdek, o.agent ? 'Агент: ' + o.agent : ''].filter(Boolean).map(function (x) { return '<div style="color:var(--mut);font-size:13px">' + esc(x) + '</div>'; }).join('') + '</td>' +
          '<td>' + esc(itemsText(o)) + (o.comment ? '<div style="color:var(--mut);font-size:13px">' + esc(o.comment) + '</div>' : '') + '</td>' +

          '<td><button class="btn red sm" data-a="delOrder" data-id="' + esc(o.id) + '">Удалить</button></td></tr>';

  function saveOrder() {
    var g = function (id) { return document.getElementById(id); };
    var name = g('nf_name').value.trim(), d = nat(g('nf_phone').value);
    var qty = Math.max(1, parseInt(g('nf_qty').value, 10) || 1), price = Math.max(0, Number(g('nf_price').value) || 0);
    var p = PRODUCTS[Number(g('nf_prod').value)];
    var pname = p.name === 'Другое' ? g('nf_custom').value.trim() : p.name;
    g('nf_err').textContent = ''; g('nf_perr').textContent = '';
    if (name.length < 2) { g('nf_err').textContent = 'Введите имя клиента'; return; }
    if (d.length && d.length !== 10) { g('nf_perr').textContent = 'Нужно 10 цифр'; return; }
    if (!pname) { g('nf_err').textContent = 'Введите название товара'; return; }
    if (!price) { g('nf_err').textContent = 'Укажите цену'; return; }
    var list = orders();
    var num = list.reduce(function (m, o) { return Math.max(m, Number(o.num) || 0); }, 0) + 1;
    var dt = g('nf_date').value ? new Date(g('nf_date').value + 'T12:00:00') : new Date();
    list.push({
      id: uid(), num: num, date: dt.toISOString(), customer: name, phone: d.length === 10 ? '+7' + d : '',
      items: [{ name: pname, qty: qty, price: price }], total: qty * price,
      status: g('nf_status').value, comment: g('nf_comment').value.trim(), manual: true
    });
    if (save('tl_orders', list)) { st.showForm = false; toast('Продажа добавлена'); shell(); }
  }

  function csv() {
    var rows = [['№', 'Дата', 'Клиент', 'Телефон', 'Состав', 'Сумма', 'Статус', 'Комментарий']];
    filteredOrders().forEach(function (o) {
      rows.push([o.num || o.id, fdate(o.date), o.customer || '', showPhone(o.phone), itemsText(o), orderTotal(o), STATUS[o.status] || o.status, o.comment || '']);
    });
    var text = '\uFEFF' + rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    download('orders.csv', text, 'text/csv;charset=utf-8');
  }

  function download(name, text, type) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- ОТЗЫВЫ ---------- */
  function reviewsView() {
    var rs = reviews();

      '<button class="btn" data-a="toggleRevForm" style="margin-left:auto">' + (st.showRevForm ? 'Скрыть форму' : '+ Добавить отзыв') + '</button></div>' +

      (list.length ? list.map(reviewCard).join('') : '<div class="card empty">Здесь пусто</div>');

  function revForm() {
    return '<div class="card"><h2>Новый отзыв (публикуется сразу)</h2><div class="form">' +
      '<div><label>Имя автора</label><input id="rf_name" placeholder="Имя"></div>' +

      '<div><label>Оценка</label><div class="rate" id="rf_rate">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-a="rate" data-n="' + n + '">★</button>'; }).join('') + '</div></div>' +

  function paintRate() {
    var box = document.getElementById('rf_rate'); if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.classList.toggle('on', Number(b.getAttribute('data-n')) <= st.rrating); });

  function reviewCard(r) {
    var editing = st.editing === r.id, act = '';
    if (editing) {
      act = '<button class="btn sm" data-a="saveEdit" data-id="' + esc(r.id) + '">Сохранить</button><button class="btn ghost sm" data-a="cancelEdit">Отмена</button>';

      if (r.status !== 'approved') act += '<button class="btn sm" data-a="setRev" data-s="approved" data-id="' + esc(r.id) + '">Опубликовать</button>';

      act += '<button class="btn ghost sm" data-a="edit" data-id="' + esc(r.id) + '">Редактировать</button><button class="btn red sm" data-a="delRev" data-id="' + esc(r.id) + '">Удалить</button>';
    }
    return '<div class="rv"><div class="rv__head"><div><span class="rv__stars">' + stars(r.rating) + '</span> <b>' + esc(r.name) + '</b></div><span style="color:var(--mut)">' + fdate(r.date) + '</span></div>' +
      (editing ? '<textarea id="edit_text">' + esc(r.text) + '</textarea>' : '<p>' + esc(r.text) + '</p>') +
      '<div class="rv__act">' + act + '</div></div>';

  function updateReviews(fn) { var l = reviews(); fn(l); if (save('tl_reviews', l)) shell(); }

  function saveRev() {
    var g = function (id) { return document.getElementById(id); };
    var name = g('rf_name').value.trim(), text = g('rf_text').value.trim();
    if (name.length < 2) { g('rf_err').textContent = 'Введите имя автора'; return; }
    if (!st.rrating) { g('rf_err').textContent = 'Поставьте оценку'; return; }
    if (text.length < 10) { g('rf_err').textContent = 'Текст слишком короткий'; return; }
    var dt = g('rf_date').value ? new Date(g('rf_date').value + 'T12:00:00') : new Date();
    updateReviews(function (l) { l.push({ id: uid(), name: name, rating: st.rrating, text: text, date: dt.toISOString(), status: 'approved', source: 'admin' }); });
    st.showRevForm = false; st.rrating = 0; st.rtab = 'approved'; toast('Отзыв опубликован'); shell();
  }

  /* ---------- КЛИЕНТЫ ---------- */
  function clientsView() {
    var map = {};
    users().forEach(function (u) { map[u.phone] = { name: u.name, phone: u.phone, reg: u.createdAt, n: 0, sum: 0 }; });
    orders().forEach(function (o) {
      var k = o.phone || ('name:' + (o.customer || ''));
      if (!map[k]) map[k] = { name: o.customer || '—', phone: o.phone || '', reg: null, n: 0, sum: 0 };
      map[k].n++; if (REVENUE[o.status]) map[k].sum += orderTotal(o);

      list.map(function (c) {
        return '<tr><td>' + esc(c.name) + '</td><td>' + esc(showPhone(c.phone)) + '</td><td>' + (c.reg ? fdate(c.reg) : '—') + '</td><td>' + c.n + '</td><td><b>' + money(c.sum) + '</b></td></tr>';
      }).join('') + '</tbody></table></div>';

  /* ---------- НОВЫЕ РАЗДЕЛЫ: каталог, отчёты, рассылка, сервис ---------- */
  var X = { views: { catalog: 1, reports: 1, mailing: 1, service: 1 }, data: {}, loading: {} };
  var XURL = { catalog: '?action=products', reports: '?action=reports', mailing: '?action=mailing', service: '?action=backups' };

  function xapi(qs, body) {
    var opt = { credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch' } };
    if (body) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
    return fetch('admin_api.php' + qs, opt).then(function (r) { return r.json(); });
  }
  function xload(v) {
    if (X.loading[v]) return;
    X.loading[v] = true;
    xapi(XURL[v]).then(function (d) { X.data[v] = d && d.success ? d : { error: (d && d.message) || 'Ошибка загрузки' }; })
      .catch(function () { X.data[v] = { error: 'Нет связи с сервером' }; })
      .then(function () { X.loading[v] = false; if (X.views[st.view] && st.view === v) { var el = document.getElementById('view'); if (el) { el.removeAttribute('data-xv'); extraPaint(el); } } });
  }
  function xreload(v) { delete X.data[v]; var el = document.getElementById('view'); if (el) el.removeAttribute('data-xv'); paint(); }
  function extraPaint(v) {
    var name = st.view;
    if (v.getAttribute('data-xv') === name) return;
    var d = X.data[name];
    if (!d) { v.innerHTML = '<div class="empty">Загрузка…</div>'; xload(name); return; }
    v.setAttribute('data-xv', name);
    if (d.error) { v.innerHTML = '<div class="note">' + esc(d.error) + '</div>'; return; }
    v.innerHTML = name === 'catalog' ? catalogView(d) : name === 'reports' ? reportsView(d.report) : name === 'mailing' ? mailingView(d) : serviceView(d);
  }
  function pct(a, b) { return b ? Math.round(100 * a / b) + '%' : '—'; }
  function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(n / 1024)) + ' КБ'; }
  var MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  /* ----- каталог ----- */
  function catalogView(d) {
    var rows = (d.products || []).map(function (p) {
      var id = 'p_' + p.slug + '_';
      return '<tr data-slug="' + esc(p.slug) + '"><td><b>' + esc(p.slug) + '</b></td>' +
        '<td><input id="' + id + 'name" value="' + esc(p.name) + '" style="width:190px" maxlength="100"></td>' +
        '<td><input id="' + id + 'price" type="number" min="0" value="' + (Number(p.price) || 0) + '" style="width:110px"></td>' +
        '<td><textarea id="' + id + 'desc" style="min-height:64px;min-width:220px" maxlength="600">' + esc(p.desc) + '</textarea></td>' +
        '<td><input id="' + id + 'page" value="' + esc(p.page) + '" style="width:150px" placeholder="treelife-lite"></td>' +
        '<td><input id="' + id + 'sort" type="number" value="' + (Number(p.sort) || 0) + '" style="width:70px"></td>' +
        '<td><input id="' + id + 'active" type="checkbox"' + (p.active ? ' checked' : '') + '></td>' +
        '<td style="white-space:nowrap"><button class="btn sm" data-a="pSave" data-slug="' + esc(p.slug) + '">Сохранить</button> ' +
        '<button class="btn red sm" data-a="pDel" data-slug="' + esc(p.slug) + '">Удалить</button></td></tr>';
    }).join('');
    return '<div class="note" style="margin-bottom:14px">Цены и названия отсюда используются в боте MAX и при оформлении заказов (цену из браузера сервер не берёт). ' +
      'Цены на страницах сайта подтягиваются автоматически. Снимите «Показ», чтобы убрать товар из бота и заказов, не удаляя его. ' +
      'Новый товар появится в боте и в ручных заказах; чтобы он был и на сайте, нужна его страница и карточка в каталоге.</div>' +
      '<div class="tablewrap"><table><thead><tr><th>Код</th><th>Название</th><th>Цена, ₽</th><th>Описание</th><th>Страница</th><th>Порядок</th><th>Показ</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card" style="margin-top:18px"><h2>Добавить товар</h2><div class="form">' +
      '<div><label>Код (латиница и цифры)</label><input id="np_slug" maxlength="20" placeholder="pro"></div>' +
      '<div><label>Название</label><input id="np_name" maxlength="100"></div>' +
      '<div><label>Цена, ₽</label><input id="np_price" type="number" min="0" value="0"></div>' +
      '<div><label>Страница на сайте (необязательно)</label><input id="np_page" placeholder="treelife-pro"></div>' +
      '<div class="wide"><label>Описание для бота</label><input id="np_desc" maxlength="600"></div></div>' +
      '<div class="err" id="np_err"></div><button class="btn" data-a="pAdd">Добавить</button></div>';
  }
  function pItem(slug, pre, isNew) {
    function g(k) { return document.getElementById(pre + k); }
    return { slug: slug, name: g('name').value, price: g('price').value, desc: g('desc').value, page: g('page').value, sort: g('sort') ? g('sort').value : 100, active: g('active') ? g('active').checked : true, is_new: !!isNew };
  }

  /* ----- отчёты ----- */
  function reportsView(r) {
    var t = r.totals, f = r.funnel, src = r.sources;
    var max = Math.max.apply(null, r.months.map(function (m) { return m.revenue; }).concat([1]));
    var chart = r.months.map(function (m) {
      var mm = Number(m.month.slice(5, 7)) - 1;
      return '<div title="' + m.month + ': ' + money(m.revenue) + ', заказов ' + m.orders + '"><i style="height:' + Math.round(m.revenue / max * 100) + '%"></i>' + MONTHS[mm] + '</div>';
    }).join('');
    var trs = r.months.slice().reverse().map(function (m) {
      return '<tr><td>' + m.month + '</td><td>' + m.orders + '</td><td>' + m.site + ' / ' + m.bot + ' / ' + m.manual + '</td><td>' + m.calls + '</td><td><b>' + money(m.revenue) + '</b></td></tr>';
    }).join('');
    var names = { site: 'Сайт', bot: 'Бот MAX', manual: 'Вручную (звонок, соцсети)' };
    var srcRows = ['site', 'bot', 'manual'].map(function (k) {
      return '<tr><td>' + names[k] + '</td><td>' + src[k].orders + '</td><td>' + pct(src[k].orders, t.orders) + '</td><td>' + money(src[k].revenue) + '</td></tr>';
    }).join('');
    var prodRows = (r.products || []).map(function (p) { return '<tr><td>' + esc(p.name) + '</td><td>' + p.qty + '</td><td>' + money(p.sum) + '</td></tr>'; }).join('');
    var stRows = Object.keys(STATUS).map(function (k) { return '<tr><td>' + STATUS[k] + '</td><td>' + ((r.status && r.status[k]) || 0) + '</td></tr>'; }).join('');
    return '<div class="grid">' +
      '<div class="stat"><small>Выручка за 12 мес.</small><b>' + money(t.revenue) + '</b></div>' +
      '<div class="stat"><small>Заказов за 12 мес.</small><b>' + t.orders + '</b></div>' +
      '<div class="stat"><small>Дошли до оплаты</small><b>' + t.paid_share + '%</b></div>' +
      '<div class="stat"><small>Средний чек</small><b>' + money(t.avg_check) + '</b></div></div>' +
      '<div class="card"><h2>Выручка по месяцам</h2><div class="chart">' + chart + '</div>' +
      '<p style="color:var(--mut);margin:10px 0 0;font-size:13px">В выручку входят заказы, по которым деньги уже получены: «Чек», «Отправка», «Отправлен», «Выполнен».</p></div>' +
      '<div class="two"><div class="card"><h2>Откуда заказы</h2><div class="tablewrap"><table style="min-width:0"><thead><tr><th>Канал</th><th>Заказов</th><th>Доля</th><th>Выручка</th></tr></thead><tbody>' + srcRows + '</tbody></table></div></div>' +
      '<div class="card"><h2>Конверсия</h2><table style="min-width:0"><tbody>' +
        '<tr><td>Регистраций на сайте</td><td>' + f.site_users + '</td></tr>' +
        '<tr><td>…из них заказывали</td><td>' + f.site_buyers + ' (' + pct(f.site_buyers, f.site_users) + ')</td></tr>' +
        '<tr><td>Пользователей бота</td><td>' + f.bot_users + '</td></tr>' +
        '<tr><td>…из них заказывали</td><td>' + f.bot_buyers + ' (' + pct(f.bot_buyers, f.bot_users) + ')</td></tr>' +
        '<tr><td>Подписчиков рассылки</td><td>' + f.subscribers + ' (' + pct(f.subscribers, f.bot_users) + ' от бота)</td></tr>' +
        '<tr><td>Заявок на звонок (из бота)</td><td>' + f.calls + ' (' + f.calls_bot + ')</td></tr>' +
      '</tbody></table></div></div>' +
      '<div class="two"><div class="card"><h2>Товары за 12 мес.</h2>' + (prodRows ? '<table style="min-width:0"><thead><tr><th>Товар</th><th>Шт.</th><th>Сумма</th></tr></thead><tbody>' + prodRows + '</tbody></table>' : '<div class="empty">Нет данных</div>') + '</div>' +
      '<div class="card"><h2>Заказы по статусам (всего)</h2><table style="min-width:0"><tbody>' + stRows + '</tbody></table></div></div>' +
      '<div class="card"><h2>По месяцам</h2><div class="tablewrap"><table><thead><tr><th>Месяц</th><th>Заказов</th><th>Сайт / бот / вручную</th><th>Заявок на звонок</th><th>Выручка</th></tr></thead><tbody>' + trs + '</tbody></table></div></div>';
  }

  /* ----- рассылка ----- */
  function mailingView(d) {
    var q = (d.questions || []).map(function (x) {
      return '<div style="padding:8px 0;border-bottom:1px solid var(--line)">' + (x.answered ? '✅ ' : '❗ ') + '<b>' + esc(x.name || ('клиент ' + x.user)) + '</b> · ' + fdate(x.date) +
        '<div style="color:var(--mut)">' + esc(String(x.text).slice(0, 200)) + '</div></div>';
    }).join('');
    return (d.bot_enabled ? '' : '<div class="note" style="margin-bottom:14px">Бот MAX не настроен (в config/max.php нет token), отправка не сработает.</div>') +
      '<div class="card"><h2>Рассылка подписчикам бота</h2>' +
      '<p style="margin-top:0;color:var(--mut)">Получат только те, кто сам нажал «Новости и акции» в боте. Под каждым сообщением есть кнопка «Отписаться». Сейчас подписчиков: <b>' + d.subscribers + '</b>. ' +
      'Пишите по делу и не чаще нескольких раз в месяц: за спам люди отписываются и блокируют бота.</p>' +
      '<textarea id="mailText" maxlength="1500" placeholder="Например: Открыта запись на очный курс в Краснодаре. Подробности по кнопке «Каталог» или в чате с менеджером."></textarea>' +
      '<div class="toolbar" style="margin-top:10px"><button class="btn ghost" data-a="mailTest">Отправить только админам (проверка)</button>' +
      '<button class="btn" data-a="mailSend">Отправить всем подписчикам (' + d.subscribers + ')</button></div>' +
      '<div class="err" id="mailMsg"></div></div>' +
      '<div class="card"><h2>Вопросы клиентов менеджеру</h2><p style="margin-top:0;color:var(--mut)">Клиент пишет вопрос в боте, он приходит администраторам. Ответить можно в боте: меню → «Вопросы клиентов» или кнопка «Ответить» под вопросом. Ответ уйдёт клиенту от имени бота.</p>' +
      (q || '<div class="empty">Вопросов пока нет</div>') + '</div>';
  }

  /* ----- сервис: резервные копии ----- */
  function serviceView(d) {
    var rows = (d.files || []).map(function (f) {
      return '<tr><td>' + esc(f.name) + '</td><td>' + new Date(f.time * 1000).toLocaleString('ru-RU') + '</td><td>' + kb(f.size) + '</td><td><button class="btn ghost sm" data-a="bkDl" data-name="' + esc(f.name) + '">Скачать</button></td></tr>';
    }).join('');
    return '<div class="card"><h2>Резервные копии базы</h2>' +
      '<p style="margin-top:0;color:var(--mut)">Копия включает все таблицы: заказы, отзывы, заявки, клиентов сайта и бота, каталог. Хранятся 14 последних в закрытой папке на сервере. ' +
      'Автоматически копия делается раз в сутки, если настроен cron.php (см. SETUP_MAX.md). Держите хотя бы одну копию и вне хостинга: скачайте файл к себе.</p>' +
      '<div class="toolbar"><button class="btn" data-a="bkMake">Создать копию сейчас</button><button class="btn ghost" data-a="bkDl" data-name="">Создать и скачать</button></div>' +
      (rows ? '<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Файл</th><th>Создан</th><th>Размер</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">Копий пока нет</div>') + '</div>';
  }
  function xdownload(name) {
    return fetch('admin_api.php?action=backup_dl&name=' + encodeURIComponent(name), { credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch' } })
      .then(function (r) {
        if (!r.ok) throw new Error('http');
        var cd = r.headers.get('Content-Disposition') || '', m = /filename="([^"]+)"/.exec(cd);
        return r.blob().then(function (b) { return [b, m ? m[1] : 'bms23-backup.sql.gz']; });
      })
      .then(function (x) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(x[0]); a.download = x[1];
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]'); if (!t) return;
    var a = t.getAttribute('data-a');
    if (a === 'pSave') {
      var slug = t.getAttribute('data-slug');
      xapi('', { action: 'product_save', item: pItem(slug, 'p_' + slug + '_', false) }).then(function (d) {
        if (d.success) { toast('Сохранено'); xreload('catalog'); } else toast(d.message || 'Не удалось сохранить');
      }).catch(function () { toast('Нет связи с сервером'); });
    } else if (a === 'pDel') {
      var s2 = t.getAttribute('data-slug');
      if (confirm('Удалить товар «' + s2 + '»? Старые заказы не пострадают. Чтобы просто убрать из продажи, снимите «Показ».')) {
        xapi('', { action: 'product_delete', slug: s2 }).then(function (d) { if (d.success) { toast('Удалено'); xreload('catalog'); } else toast(d.message || 'Ошибка'); });
      }
    } else if (a === 'pAdd') {
      var it = pItem(document.getElementById('np_slug').value.toLowerCase().trim(), 'np_', true);
      it.sort = 1000;
      xapi('', { action: 'product_save', item: it }).then(function (d) {
        if (d.success) { toast('Товар добавлен'); xreload('catalog'); } else document.getElementById('np_err').textContent = d.message || 'Ошибка';
      }).catch(function () { toast('Нет связи с сервером'); });
    } else if (a === 'mailTest' || a === 'mailSend') {
      var text = document.getElementById('mailText').value.trim(), msg = document.getElementById('mailMsg');
      msg.textContent = '';
      if (text.length < 5) { msg.textContent = 'Введите текст сообщения'; return; }
      var all = a === 'mailSend';
      if (all && !confirm('Отправить сообщение всем подписчикам? Отменить рассылку после запуска нельзя.')) return;
      t.disabled = true; msg.style.color = 'var(--mut)'; msg.textContent = 'Отправляем, не закрывайте страницу…';
      xapi('', { action: all ? 'broadcast' : 'broadcast_test', text: text, confirm: all }).then(function (d) {
        t.disabled = false;
        if (d.success) { msg.style.color = 'var(--green)'; msg.textContent = 'Отправлено: ' + d.sent + (d.failed ? ', не доставлено: ' + d.failed : ''); }
        else { msg.style.color = 'var(--red)'; msg.textContent = d.message || 'Ошибка'; }
      }).catch(function () { t.disabled = false; msg.style.color = 'var(--red)'; msg.textContent = 'Связь прервалась. Проверьте, дошли ли сообщения, прежде чем отправлять снова.'; });
    } else if (a === 'bkMake') {
      t.disabled = true;
      xapi('', { action: 'backup_make' }).then(function (d) { t.disabled = false; if (d.success) { toast('Копия создана'); xreload('service'); } else toast(d.message || 'Ошибка'); })
        .catch(function () { t.disabled = false; toast('Нет связи с сервером'); });
    } else if (a === 'bkDl') {
      xdownload(t.getAttribute('data-name') || '').then(function () { xreload('service'); }).catch(function () { toast('Не удалось скачать'); });
    }
  });

  /* ---------- события ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]'); if (!t) return;
    var a = t.getAttribute('data-a'), id = t.getAttribute('data-id');
    if (a === 'nav') { st.view = t.getAttribute('data-v'); shell(); }
    else if (a === 'logout') { fetch('logout.php', { method: 'POST', credentials: 'same-origin' }).then(function () { location.href = '/'; }); }
    else if (a === 'toggleForm') { st.showForm = !st.showForm; paint(); }
    else if (a === 'saveOrder') saveOrder();
    else if (a === 'csv') csv();
    else if (a === 'delOrder') { if (confirm('Удалить заказ?')) { save('tl_orders', orders().filter(function (o) { return o.id !== id; })); toast('Удалено'); shell(); } }
    else if (a === 'delCall') { if (confirm('Удалить заявку?')) { save('tl_calls', calls().filter(function (c) { return c.id !== id; })); toast('Удалено'); shell(); } }
    else if (a === 'rtab') { st.rtab = t.getAttribute('data-t'); st.editing = null; paint(); }
    else if (a === 'toggleRevForm') { st.showRevForm = !st.showRevForm; st.rrating = 0; paint(); }
    else if (a === 'rate') { st.rrating = Number(t.getAttribute('data-n')); paintRate(); }
    else if (a === 'saveRev') saveRev();
    else if (a === 'setRev') { var s = t.getAttribute('data-s'); updateReviews(function (l) { l.forEach(function (r) { if (r.id === id) r.status = s; }); }); toast(s === 'approved' ? 'Опубликовано' : 'Отклонено'); }
    else if (a === 'delRev') { if (confirm('Удалить отзыв?')) { updateReviews(function (l) { for (var i = l.length - 1; i >= 0; i--) if (l[i].id === id) l.splice(i, 1); }); } }
    else if (a === 'edit') { st.editing = id; paint(); }
    else if (a === 'cancelEdit') { st.editing = null; paint(); }
    else if (a === 'saveEdit') {
      var txt = document.getElementById('edit_text').value.trim();
      if (txt.length < 10) { toast('Текст слишком короткий'); return; }
      st.editing = null; updateReviews(function (l) { l.forEach(function (r) { if (r.id === id) r.text = txt; }); }); toast('Сохранено');
    }
    else if (a === 'backup') {
      var dump = { exportedAt: new Date().toISOString(), tl_orders: orders(), tl_reviews: reviews(), tl_users: users(), tl_calls: calls() };
      download('treelife-backup-' + dkey(new Date()) + '.json', JSON.stringify(dump, null, 2), 'application/json');
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'oq') { st.oq = e.target.value; document.getElementById('otable').innerHTML = ordersTable(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'of') { st.of = t.value; document.getElementById('otable').innerHTML = ordersTable(); }
    else if (t.hasAttribute('data-status')) {
      var id = t.getAttribute('data-status'), l = orders();
      l.forEach(function (o) { if (o.id === id) o.status = t.value; });
      if (save('tl_orders', l)) { toast('Статус обновлён'); shell(); }
    }
    else if (t.id === 'restoreFile') {
      var f = t.files && t.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!Array.isArray(d.tl_orders) || !Array.isArray(d.tl_reviews) || !Array.isArray(d.tl_users)) throw 0;
          if (!confirm('Заменить текущие данные копией?')) return;
          save('tl_orders', d.tl_orders); save('tl_reviews', d.tl_reviews); save('tl_users', d.tl_users);
          toast('Данные восстановлены'); shell();
        } catch (x) { toast('Файл не похож на копию'); }
      };
      rd.readAsText(f);
    }
  });

  shell();

  } // конец init()
})();
</script>
</body>
</html>
